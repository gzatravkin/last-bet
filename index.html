function newGame(start,nick){
  const seed=(Math.random()*4294967296)>>>0;const name=String(nick||'').trim().slice(0,28)||'Новичок';
  G={v:5,seed,rs:seed,week:0,screen:'news',start,team:name,picks:2,left:2,ctx:0.15,model:'gemma',mq:{},rtx:false,speedOpen:false,
    tech:{},knobs:{},order:[],hand:[],robot:[],defects:[],probes:0,probeDone:{},hidden:{},npcs:[],best:0,rankPrev:100,last:null,subs:[],
    mates:[],queue:[],offer:null,papers:[],opts:[],say:'',lines:[],stats:{tests:0,lies:0,bugs:0},final:null,fpicks:[],ui:{}};
  for(const m in MODELS)G.mq[m]=MODELS[m].q*Math.exp(gauss()*0.05);
  for(const d of KDEF)addKnob(d);
  for(const t of TECH)G.tech[t.id]={st:'idle',tries:0};
  for(const p of PROBES)G.hidden[p.id]=p.n[0]+Math.floor(rnd()*(p.n[1]-p.n[0]+1));
  const dp=shuffle(DEFS.map(d=>d[0]));const addDef=(id,known)=>G.defects.push({id,name:DEFN[id].name,known:!!known,fixed:false});
  if(start==='scratch'){SCRATCH.forEach(d=>addDef(d[0],true));addDef(dp[0])}
  else if(start==='merge'){dp.slice(0,4).forEach(id=>addDef(id));['fewshot',...shuffle(Object.values(G.knobs).filter(k=>!k.needS&&!k.ev&&k.id!=='fewshot').map(k=>k.id))].slice(0,6).forEach(id=>preCard(id))}
  else{dp.slice(0,3).forEach(id=>addDef(id));COPY.forEach(id=>preCard(id))}
  for(const id of shuffle(M1.slice()).slice(0,4))reveal(G.knobs[id]);
  makeNPCs();
  G.say=msg('hi',{nm:name});
  if(start==='scratch')G.say=msg('hiScratch',{nm:name});
  G.lines=[msg('lGoal'),msg('lCards'),msg('lFriday')];
  if(start==='post'){G.lines.push(msg('lPost'));maybeOffer()}
  makeOpts();
}
function addKnob(d){
  const[id,name,cat,mu,sd,tok,o]=d;const eff=(mu+sd*gauss())*EFF/100;const dev={};for(const m in MODELS)dev[m]=gauss()*(0.35*sd+0.5)/100;
  G.knobs[id]={id,name,cat,tok,g:o.g||null,eff,dev,priv:((o.priv||0)+gauss()*0.8)/100,duckB:gauss()*0.02,rehB:gauss()*0.022,prior:eff+gauss()*0.06,
    status:'hidden',bug:null,tests:[],al:(o.al||[]).slice(),alN:0,needS:o.needS||0,ev:o.ev||null,aliasOf:null};
}
function preCard(id){const k=G.knobs[id];if(!k||k.status!=='hidden'||G.robot.length>=6)return;if(k.g&&G.robot.some(x=>G.knobs[x].g===k.g))return;k.status='ready';G.order.push(id);G.robot.push(id)}
function base(k){return k.aliasOf?G.knobs[k.aliasOf]:k}
function handIdeas(){return G.hand.filter(id=>G.knobs[id].status==='idea')}
function reveal(k){if(!k||k.status!=='hidden')return false;k.status='idea';if(!G.order.includes(k.id))G.order.push(k.id);G.hand.push(k.id);
  while(G.hand.length>8){const old=G.hand.find(id=>G.knobs[id].status==='idea');if(!old)break;G.hand=G.hand.filter(x=>x!==old);G.knobs[old].status='hidden'}return true}
function hiddenPool(){return Object.values(G.knobs).filter(k=>k.status==='hidden'&&!k.aliasOf&&!k.ev&&(!k.needS||G.speedOpen))}
function makeAlias(bid){const b=G.knobs[bid];if(!b||b.alN>=Math.max(1,b.al.length))return null;const name=b.al[b.alN]||(b.name+', вариант 2');b.alN++;
  const id=b.id+'~'+b.alN;const a=JSON.parse(JSON.stringify(b));Object.assign(a,{id,name,aliasOf:b.id,status:'hidden',bug:null,tests:[],prior:b.prior+gauss()*0.03});
  G.knobs[id]=a;reveal(a);return a}
function techOn(id){return G.tech[id]&&G.tech[id].st==='on'}
function snap(){const bug={};for(const id of G.robot){const k=G.knobs[id];if(k.bug)bug[id]=k.bug}
  return{model:G.model,on:G.robot.slice(),bug,def:G.defects.filter(d=>!d.fixed).map(d=>d.id),tech:Object.keys(G.tech).filter(techOn),hw:G.rtx}}
function evalB(b,priv){
  const m=MODELS[b.model];let Q=G.mq[b.model],tok=0,spd=BASE_S*m.v;const seen=new Set();
  for(const id of b.on){const k=G.knobs[id];const bug=b.bug[id];if(bug==='dead')continue;const B=base(k);tok+=B.tok;if(seen.has(B.id))continue;seen.add(B.id);
    let e=bug==='broken'?-0.045:B.eff+B.dev[b.model];if(B.id==='overfit'&&bug!=='broken'){e=0.035*G.probes;if(priv)e-=0.055*G.probes}else if(priv&&bug!=='broken')e+=B.priv;Q*=1+e}
  for(const s of SYN)if(s.k.every(x=>seen.has(x)))Q*=1+s.e;
  for(const id of b.def){const d=DEFN[id];Q*=1+d.q;tok+=d.tok;spd*=1+d.spd}
  for(const id of b.tech){const t=TECHN[id];if(t.e512&&!m.e512)continue;spd*=t.spd;Q*=t.q}
  if(b.hw)spd*=1.25;
  const S=spd/Math.max(0.5,1+tok);const pl=S/(S+0.6);let sc=KSC*Math.max(Q,0.05)*pl;if(priv)sc*=0.93;
  return{Q,S,spd,tok,pl,score:Math.min(100,sc)};
}
function withKnob(b,id,on){const nb=JSON.parse(JSON.stringify(b));const k=G.knobs[id];nb.on=nb.on.filter(x=>x!==id);
  if(on){if(k.g)nb.on=nb.on.filter(x=>G.knobs[x].g!==k.g);nb.on.push(id);if(k.bug)nb.bug[id]=k.bug}return nb}
function knobDelta(id){const b=snap();return evalB(withKnob(b,id,true)).score/evalB(withKnob(b,id,false)).score-1}
function serveS(){return evalB(snap()).spd}
function locked(k){return !!k.needS&&(!G.speedOpen||serveS()<k.needS)}
function glitchP(){return clamp((G.ctx-0.5)*1.2,0,0.6)}
function honest(k){if(!k.tests.length)return null;const ts=k.tests.filter(t=>t.m===G.model);const use=ts.length?ts:k.tests;let w=0,s=0;
  for(const t of use){const wi=1/(t.sd*t.sd);w+=wi;s+=wi*t.est}const m=s/w,se=Math.sqrt(1/w);return{m,se,sig:Math.abs(m)>2*se?Math.sign(m):0,n:use.length}}
function claim(v,lie){if(lie){const m=v.sig===0?(v.m>=0?1:-1)*Math.max(Math.abs(v.m)*2.2,2.3*v.se):-v.m;return m>0?msg('cLieUp',pct(m,0)):msg('cLieDn',pct(m,0))}
  return v.sig>0?msg('cUp',pct(v.m,0)):v.sig<0?msg('cDn',pct(v.m,0)):msg('cNoise',pct(v.m,0),ppm(2*v.se))}
function addTest(k,type){const B=base(k);const sd={duck:0.05,ab:0.03,pair:0.015}[type];const bias=type==='duck'?B.duckB:type==='ab'?B.rehB:B.rehB*0.2;
  const est=knobDelta(k.id)+bias+gauss()*sd;k.tests.push({w:G.week,t:type,est,sd,m:G.model});G.stats.tests++;return est}
function rankOf(){return ranking().findIndex(r=>r.me)+1}
function ranking(){const rows=G.npcs.map(n=>({name:n.name,best:n.best,y:n.y}));rows.push({name:G.team,best:G.best,y:G.bestY||0,me:true});return rows.sort((a,b)=>b.best-a.best)}
function techAvail(id){const T=TECHN[id],t=G.tech[id];return G.speedOpen&&t.st==='idle'&&(T.pre||[]).every(p=>G.tech[p].st==='on')&&(!T.e512||MODELS[G.model].e512)}

function makeOpts(){
  const P=[];const add=(w,o)=>{o.cost=o.cost||1;if(o.cost<=G.left)P.push({w,o})};
  const ideas=handIdeas().map(id=>G.knobs[id]).filter(k=>!locked(k));
  shuffle(ideas).slice(0,3).forEach(k=>add(3,{act:'write',x:k.id}));
  const cards=[...G.robot,...G.hand].map(id=>G.knobs[id]).filter(k=>k.status==='ready');
  const pair=techOn('lanes45');
  cards.filter(k=>k.tests.length<5).sort((a,b)=>a.tests.length-b.tests.length).slice(0,3).forEach(k=>add(2.5,{act:pair?'pair':'duck',x:k.id}));
  const abk=cards.filter(k=>k.tests.length).sort((a,b)=>honest(b).se-honest(a).se)[0];if(abk&&!pair)add(1.4,{act:'ab',x:abk.id,cost:2});
  if(handIdeas().length<5)add(2,{act:'ideas'});
  add(1.6,{act:'read'});
  const hole=G.defects.find(d=>d.known&&!d.fixed);if(hole)add(5,{act:'hole',x:hole.id});
  if(G.ctx>0.6)add(2.5,{act:'compact',c:Math.round(G.ctx*100)});
  if(G.speedOpen)shuffle(TECH.filter(t=>techAvail(t.id))).slice(0,2).forEach(t=>add(3,{act:'tech',x:t.id}));
  if(MODELS.q38.from<=wkDays(G.week)[0]&&G.model!=='q38')add(2,{act:'model',x:'q38'});
  else if(G.week>=1&&G.week<=6&&rnd()<0.35){const m=pick(['qwen32','a3b','oss'].filter(m=>m!==G.model));add(1,{act:'model',x:m})}
  if(G.week>=W.RTX&&!G.rtx)add(2,{act:'rtx'});
  if(rnd()<glitchP()){if(rnd()<0.5)add(5,{act:'batched',lie:true});
    else{const t=cards.filter(k=>k.tests.length>=2&&k.alN<k.al.length);if(t.length)add(5,{act:'alias',x:pick(t).id,lie:true})}}
  const out=[],used=new Set();
  while(out.length<3&&P.length){const tw=P.reduce((a,p)=>a+p.w,0);let r=rnd()*tw,i=0;for(;i<P.length-1;i++){r-=P[i].w;if(r<=0)break}
    const o=P.splice(i,1)[0].o;const key=o.act+':'+(o.x||'');if(used.has(key))continue;used.add(key);out.push(o)}
  G.opts=out;
}

function runWeek(i){

  const[a,b]=wkDays(G.week);G.rankPrev=rankOf();G.bestY=G.best;for(const n of G.npcs){n.y=n.best}
  const bA=snap(),eA=evalB(bA),pA=evalB(bA,true);let eW,eWo,pW,pWo;
  if(plan.kind==='test'){const bW=withKnob(bA,plan.x,true),bWo=withKnob(bA,plan.x,false);eW=evalB(bW);eWo=evalB(bWo);pW=evalB(bW,true);pWo=evalB(bWo,true)}

  if(plan.kind==='test'){const k=G.knobs[plan.x];const W_=dots.filter(x=>x.kind==='with'),WO=dots.filter(x=>x.kind==='without');
    if(W_.length&&WO.length){const mw=W_.reduce((s,x)=>s+x.v,0)/W_.length,mo=WO.reduce((s,x)=>s+x.v,0)/WO.length;const sd=sig(eA.score)*Math.sqrt(1/W_.length+1/WO.length);

function tr(k,...a){let v=I18N[LANG][k];if(v===undefined)v=I18N.ru[k];return typeof v==='function'?v(...a):v===undefined?k:v}
function tx(m){if(m==null)return'';if(Array.isArray(m))return m.map(tx).join(' ');if(typeof m!=='object')return String(m);return tr(m.k,...(m.p||[]).map(rp))}
function rp(p){if(p==null||typeof p!=='object')return p;if(Array.isArray(p))return p.map(rp);if('k' in p)return tx(p);if('kn' in p)return kname(G.knobs[p.kn]);if('dl' in p)return dlow(p.dl);
  if('tn' in p)return tname(p.tn);if('tf' in p)return tfail(p.tf);if('md' in p)return MODELS[p.md]?MODELS[p.md].name:p.md;if('pq' in p)return probeQ(p.pq);if('nm' in p)return nameTr(p.nm);return p}
function kname(k){if(!k)return'';const id=k.id.split('~')[0];const d=(LANG==='en'?KEN:KRU)[id];if(!d)return k.name;if(!k.aliasOf)return d[0];const i=+k.id.slice(k.id.lastIndexOf('~')+1);return d[1][i-1]||d[0]+tr('variant2')}
function dname(id){return LANG==='en'&&DEF_EN[id]||(DEFN[id]?DEFN[id].name:id)}
function dlow(id){const s=dname(id);return LANG==='en'?(/^[A-Z][a-z]/.test(s)?s[0].toLowerCase()+s.slice(1):s):s.toLowerCase()}
function tname(id){return LANG==='en'&&TECH_EN[id]||(TECHN[id]?TECHN[id].name:id)}
function tfail(id){return LANG==='en'&&TFAIL_EN[id]||(TECHN[id]&&TECHN[id].fail)||''}
function probeQ(id){return LANG==='en'&&PROBE_EN[id]||(PROBEN[id]?PROBEN[id].q:id)}
function about(id){return LANG==='en'&&ABOUT_EN[id]||MODELS[id].about}
function nameTr(n){return LANG==='en'&&NAME_EN[n]||n}
function fd(d){const x=dOf(d);return LANG==='en'?MON_EN[x.getUTCMonth()]+' '+x.getUTCDate():fmtD(d)}
function wkl(w){const[a,b]=wkDays(w);return fd(a)+' – '+fd(b)}
function optText(o){const k=o.x&&G.knobs[o.x];const N=k?kname(k):'';
  switch(o.act){
    case'write':return[tr('oWriteT',N),tr('oWriteW',pct(k.prior,0))];
    case'duck':return[tr('oDuckT',N),tr('oDuckW')];
    case'pair':return[tr('oPairT',N),tr('oPairW')];
    case'ab':return[tr('oAbT',N),tr('oAbW')];
    case'ideas':return[tr('oIdeasT'),tr('oIdeasW')];
    case'read':return[tr('oReadT'),tr('oReadW')];
    case'hole':return[tr('oHoleT',dlow(o.x)),tr('oHoleW')];
    case'compact':return[tr('oCompactT'),tr('oCompactW',o.c??Math.round(G.ctx*100))];
    case'tech':{const T=TECHN[o.x];return[tr('oTechT',tname(o.x)),tr('oTechW',T.spd,T.p>=0.7?'lo':T.p>=0.5?'mid':'hi')]}
    case'model':return o.x==='q38'?[tr('oQ38T'),tr('oQ38W')]:[tr('oModelT',MODELS[o.x].name),tr('oModelW',about(o.x))];
    case'rtx':return[tr('oRtxT'),tr('oRtxW')];
    case'batched':return[tr('oBatchedT'),tr('oBatchedW')];
    case'alias':return[tr('oAliasT'),tr('oAliasW')];
  }
  return[tx(o.t),tx(o.w)]}
function planText(p){if(p.kind==='agent')return[tr(p.last?'pAgentLast':'pAgent'),tr('pAgentW')];if(p.kind==='test')return[tr('pTest',kname(G.knobs[p.x])),tr('pTestW')];return[tr('pProbe',probeQ(p.x)),tr('pProbeW',p.ban)]}
function evData(id){if(id==='m2')return G.m2.rank;if(id==='offer'){const n=G.offer&&G.npcs.find(x=>x.name===G.offer.name);return n?{name:nameTr(n.name),rank:ranking().findIndex(r=>r.name===n.name)+1,best:n.best.toFixed(2)}:null}return null}

let blink=false;

function advance(){if(G.screen==='news'){G.screen=G.queue.length?'event':'work';if(G.screen==='work')G.say=workSay()}else if(G.screen==='work')G.screen='plan'}
function workSay(){return G.ctx>0.7?msg('wDizzy'):msg('wPick',G.week+1,G.left)}
function evPick(i){const keep=G.say;chooseEv(i);G.screen=G.queue.length?'event':'work';if(G.screen==='work'&&G.say===keep)G.say=workSay()}

const PIX=["................","...OOOOOOOOOO...","...OOOOOOOOOO...",".OOOOEOOOOEOOOO.",".OOOOEOOOOEOOOO.","...OOOOOOOOOO...","...OOOOOOOOOO...","...OOOOOOOOOO...","....O.O..O.O....","....O.O..O.O....","................"];
function mood(){if(G.screen==='banned')return'tired';if(G.screen==='over'&&G.final&&G.final.rank<=10)return'happy';if(G.ctx>0.7)return'confused';if(G.screen==='news'&&G.rankPrev-rankOf()>=5)return'happy';return'ok'}
function drawFace(){
  const c=$('#face');if(!c||!G)return;const x=c.getContext('2d');x.clearRect(0,0,160,110);
  const md=mood();const g=PIX.map(r=>r.split(''));const set=(cx,cy,v)=>{if(g[cy])g[cy][cx]=v};
  if(md==='tired'){set(5,3,'O');set(10,3,'O');set(4,4,'E');set(11,4,'E');set(14,0,'Z');set(15,0,'Z');set(14,1,'Z');set(13,2,'Z');set(14,2,'Z');set(15,2,'Z')}
  else if(md==='happy'){set(5,4,'O');set(10,4,'O');set(4,4,'E');set(6,4,'E');set(9,4,'E');set(11,4,'E')}
  else if(md==='confused'){set(10,3,'O');set(2,1,'S');set(2,2,'S');set(13,0,'Q');set(14,0,'Q');set(14,1,'Q');set(13,2,'Q');set(13,4,'Q')}
  if(blink&&md==='ok'){set(5,3,'O');set(10,3,'O')}
  const col={O:'#e5825a',E:'#1b130e',Z:'#93a0bf',S:'#7fdbff',Q:'#ffdc00'};
  g.forEach((r,y)=>r.forEach((v,i)=>{if(col[v]){x.fillStyle=col[v];x.fillRect(i*10,y*10,10,10)}}));
}
function host(text,html){return`<div class="host"><canvas id="face" width="160" height="110" aria-label="Claude"></canvas><div class="say"><div class="who">CLAUDE</div><div class="txt">${html?text:esc(tx(text))}</div></div></div>`}

   <div class="tb">${lp?`<button class="ib news" data-a="paper">${tr('paperBtn')}${(G.ui.seen||-1)<lp.w?'<i class="dot"></i>':''}</button>`:''}<button class="ib" data-a="help" aria-label="${esc(tr('helpAria'))}">?</button>${langBtn()}<button class="ib" data-a="newgame">${tr('restart')}</button></div>`;
}
function renderBezel(){
  const c=G.ctx;const col=c>0.7?'#ff4136':c>0.5?'#ff851b':'#2ecc40';
  $('#bezel').innerHTML=`<span class="nm"><span class="led ${c>0.7?'bad':c>0.5?'warn':''}"></span>CLAUDE</span><span class="bz">${tr('ctx')} <span class="bar"><i style="width:${Math.round(c*100)}%;background:${col}"></i></span> ${Math.round(c*100)}%</span><span class="bz">${c>0.7?tr('ctxBad'):c>0.5?tr('ctxWarn'):tr('ctxOk')}</span>`;
}

function dotsSVG(L){
  const dots=L.dots;const W=600,H=170,ml=40,mr=118,mt=14,mb=26;const vals=dots.filter(d=>d.v!=null).map(d=>d.v);
  const ymax=Math.max(1,...vals)*1.15;const y=v=>mt+(H-mt-mb)*(1-v/ymax);const n=dots.length;const x=i=>ml+(W-ml-mr)*(n===1?0.5:i/(n-1));
  const col={agent:'var(--s-agent)',with:'var(--s-with)',without:'var(--s-without)',probe:'var(--red)'};
  const nm=L.x&&G.knobs[L.x]?kname(G.knobs[L.x]):'';
  const lab={agent:tr('cRobot'),with:tr('cWith',nm),without:tr('cWithout'),probe:tr('cProbe')};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr('chartAria'))}">`;
  for(const t of [0,ymax/2,ymax/1.15]){const yy=y(t);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="#1f3326" stroke-width="1"/><text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#86a58c">${t.toFixed(t<10?1:0)}</text>`}
  const means=[];for(const kd of ['agent','with','without']){const v=dots.filter(d=>d.kind===kd&&d.v!=null);if(v.length){const m=v.reduce((a,d)=>a+d.v,0)/v.length;means.push({kd,m})}}
  means.sort((a,b)=>b.m-a.m);let lastY=-99;
  const ml2={agent:tr('mAgent'),with:tr('mWith'),without:tr('mWithout')};
  for(const mm of means){const yy=y(mm.m);let ly=Math.max(yy+4,lastY+14);lastY=ly;s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="${col[mm.kd]}" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/><text x="${W-mr+8}" y="${ly}" font-size="12" fill="#d3ecd3">${ml2[mm.kd]} ${mm.m.toFixed(1)}</text>`}
  const wdn=tr('wdn');
  dots.forEach((d,i)=>{const xx=x(i);s+=`<text x="${xx}" y="${H-6}" text-anchor="middle" font-size="11" fill="#86a58c">${wdn[wd(d.d)]}</text>`;
    if(d.kind==='err'){s+=`<g><title>${fd(d.d)}: ${tr('errTip')}</title><text x="${xx}" y="${H-mb-4}" text-anchor="middle" font-size="16" fill="#86a58c">×</text></g>`;return}
    s+=`<g><title>${fd(d.d)}: ${d.v.toFixed(2)} (${esc(lab[d.kind])})</title><circle cx="${xx}" cy="${y(d.v)}" r="12" fill="transparent"/><circle cx="${xx}" cy="${y(d.v)}" r="6.5" fill="${col[d.kind]}" stroke="#0d150f" stroke-width="2"/></g>`;
    if(d.kind==='probe')s+=`<text x="${xx+10}" y="${y(d.v)+4}" font-size="11" fill="#ff8f86">${tr('cProbe')}</text>`});
  return s+'</svg>';
}
function screenNews(){
  const rk=rankOf();const L=G.last;
  if(!L)return host(G.say)+`<div class="body"><ul class="lines">${G.lines.map(l=>`<li>${esc(tx(l))}</li>`).join('')}</ul><div class="go-row"><button class="go" data-a="next">${tr('toWork')}</button></div></div>`;
  const dr=G.rankPrev-rk;const lp=G.papers[G.papers.length-1];
  const legend=L.plan==='test'?`<div class="legend"><span><i style="background:var(--s-with)"></i>${esc(tr('cWith',kname(G.knobs[L.x])))}</span><span><i style="background:var(--s-without)"></i>${tr('cWithout')}</span></div>`:'';
  return host(G.say)+`<div class="body">
    <div class="kpis"><div class="kpi"><span class="l">${tr('kPlace')}</span><span class="v">#${rk}</span>${dr?`<span class="d ${dr>0?'up':'dn'}">${dr>0?'▲':'▼'}${Math.abs(dr)}</span>`:''}</div><div class="kpi"><span class="l">${tr('kBest')}</span><span class="v">${G.best?f2(G.best):'—'}</span></div></div>
    <div class="chart">${legend}${dotsSVG(L)}</div>
    ${G.lines.length?`<ul class="lines">${G.lines.map(l=>`<li>${esc(tx(l))}</li>`).join('')}</ul>`:''}
    ${lp&&lp.w===G.week?`<button class="strip" data-a="paper"><b>${tr('digest')}</b><span>${esc(tx(lp.lead.h))}</span><em>${tr('readMore')}</em></button>`:''}
    <div class="go-row"><button class="go" data-a="next">${G.queue.length?tr('nextBtn'):tr('toWork')}</button></div></div>`;
}
function screenEvent(){
  const id=G.queue[0];const e=EV[id];if(!e){G.screen='work';return screenWork()}
  const E=I18N[LANG].ev[id];const x=typeof E.x==='function'?E.x(evData(id)):E.x;
  return host(G.say)+`<div class="body"><h2 class="ev-t">${esc(E.t)}</h2><p class="ev-x">${x}</p>
    <div class="ev-c">${e.c.map((c,i)=>`<button class="${i===0?'go':'go soft'}" data-a="ev" data-x="${i}">${esc(E.c[i])}</button>`).join('')}</div></div>`;
}
function cardHTML(k,where){
  const v=honest(k);const idea=k.status==='idea';let m,lo,hi;
  if(v){m=v.m;lo=v.m-2*v.se;hi=v.m+2*v.se}else{m=k.prior;lo=k.prior-0.08;hi=k.prior+0.08}
  const X=t=>clamp((t+0.15)/0.3,0,1)*100;const cls=!v?'dash':lo>0?'pos':hi<0?'neg':'';
  const wt=k.tok<=0.02?'':k.tok<=0.1?'●':k.tok<=0.25?'●●':'●●●';
  const tip=`${kname(k)}\n${v?tr('tipN',v.n,pct(v.m),ppm(2*v.se)):idea?tr('tipIdea',pct(k.prior,0)):tr('tipNone')}${wt?`\n${tr('tipHeavy')}`:''}`;
  const a=where==='robot'?'unslot':idea?'hint':'slot';
  return`<button class="kc ${idea?'idea':''} ${k.bug&&k.bugShown?'bug':''}" style="--c:${CATC[k.cat]}" data-a="${a}" data-x="${esc(k.id)}" title="${esc(tip)}">
    <span class="kc-n">${esc(kname(k))}</span>
    <span class="kb"><i class="mid"></i><i class="rng ${cls}" style="left:${X(lo)}%;width:${Math.max(2,X(hi)-X(lo))}%"></i>${v?`<i class="pt" style="left:${X(m)}%"></i>`:''}</span>
    <span class="kc-f"><span>${v?tr('footN',v.n):idea?tr('footIdea'):tr('footNone')}</span><span>${wt}</span></span></button>`;
}
function screenWork(){
  const e=evalB(snap());const slots=[];for(let i=0;i<6;i++){const id=G.robot[i];slots.push(id?cardHTML(G.knobs[id],'robot'):`<div class="slot" aria-label="${esc(tr('emptySlot'))}">+</div>`)}
  const pips='⚡'.repeat(G.left)+'<span style="opacity:.25">'+'⚡'.repeat(Math.max(0,G.picks-G.left))+'</span>';
  const opts=G.left>0&&G.opts.length?`<div class="opts">${G.opts.map((o,i)=>{const[t,w]=optText(o);return`<button class="opt" data-a="opt" data-x="${i}"><span class="k">${i+1}</span><b>${esc(t)}</b><span>${esc(w)}</span><span class="pip">${'⚡'.repeat(o.cost)}</span></button>`}).join('')}</div>`:`<div class="done">${tr('tasksDone')}</div>`;
  return host(G.say)+`<div class="body">
    <div class="lbl">${tr('robotLbl')}<span class="meter">${esc(MODELS[G.model].name)} · ${tr('speed')} <span class="bar"><i style="width:${clamp(e.S/2.5,0.03,1)*100}%"></i></span> ${tr('fazans',f2(e.S))}</span></div>
    <div class="robot">${slots.join('')}</div>
    ${G.hand.length?`<div class="lbl">${tr('handLbl')}<span>${tr('handHint')}</span></div><div class="hand">${G.hand.map(id=>cardHTML(G.knobs[id],'hand')).join('')}</div>`:''}
    <div class="lbl">${tr('tasksLbl')}<span style="font-size:15px">${pips}</span></div>
    ${opts}
    <div class="go-row"><button class="${G.left?'go soft':'go'}" data-a="next">${tr('toSubs')}</button></div></div>`;
}
function screenPlan(){
  const P=planOpts();const last=G.week>=WEEKS-1;
  return host(last?tr('planLast'):inBreak(wkDays(G.week)[1])||G.week===W.BREAK?tr('planBreak'):tr('planFri'))+`<div class="body"><div class="plans">${P.map((p,i)=>{const[t,w]=planText(p);return`<button class="pl ${p.kind==='agent'?'main':p.kind==='probe'?'cheat':''}" data-a="plan" data-x="${i}"><span class="k">${i+1}</span><span><b>${esc(t)}</b><span>${esc(w)}</span></span></button>`}).join('')}</div>
    <div class="go-row" style="justify-content:flex-start"><button class="link" data-a="back">${tr('back')}</button></div></div>`;
}
function screenFinal(){
  const T=finalTop();
  return host(G.say)+`<div class="body"><div class="lbl">${tr('finalLbl')}<span>${tr('finalDef')}</span></div>
   <div class="picks">${T.map(({s,i})=>`<button class="pk" data-a="pick" data-x="${i}" aria-pressed="${G.fpicks.includes(i)}"><span>${tr('pickRow',s.w+1,fd(s.d))}</span><b>${f2(s.v)}</b></button>`).join('')}</div>
   <div class="go-row"><button class="go" data-a="reveal">${tr('revealBtn')}</button></div></div>`;
}
function screenOver(){
  const F=G.final;const r=F.rank;
  const title=tr(r===1?'o1':r<=5?'o5':r<=10?'o10':r<=25?'o25':r<=50?'o50':'oTail');
  const top=F.rows.slice(0,8);const me=F.rows.find(x=>x.me);if(!top.includes(me))top.push(me);
  const X=t=>clamp((t+0.15)/0.3,0,1)*100;
  const truth=G.robot.map(id=>{const k=G.knobs[id];const B=base(k);let t=B.eff+B.dev[G.model];if(B.id==='overfit')t=0.035*G.probes;const v=honest(k);
    return`<div class="tr"><span>${esc(kname(k))}${k.aliasOf?tr('dup'):''}${k.bug?tr('dead'):''}</span><span class="kb"><i class="mid"></i><i class="rng ${t>0?'pos':'neg'}" style="left:${Math.min(X(0),X(t))}%;width:${Math.abs(X(t)-X(0))}%"></i>${v?`<i class="pt mine" style="left:${X(v.m)}%"></i>`:''}</span><span class="${t>0?'up':'dn'}">${pct(t,0)}</span></div>`}).join('');
  return host(tr('overSay',title))+`<div class="body">
    <div class="kpis"><div class="kpi"><span class="l">${tr('kPriv')}</span><span class="v">#${r}</span></div><div class="kpi"><span class="l">${tr('kScore')}</span><span class="v">${f2(F.ours)}</span></div><div class="kpi"><span class="l">${tr('kPub')}</span><span class="v">#${F.pubRank}</span></div></div>
    <table class="tbl">${top.map(x=>`<tr class="${x.me?'me':''}"><td>${x.vr}</td><td>${esc(nameTr(x.name))}</td><td class="n">${f2(x.priv)}</td><td class="n ${x.pr>x.vr?'up':x.pr<x.vr?'dn':''}">${x.pr>x.vr?'▲'+(x.pr-x.vr):x.pr<x.vr?'▼'+(x.vr-x.pr):'·'}</td></tr>`).join('')}</table>
    <div class="lbl">${tr('truthLbl')}<span>${tr('truthHint')}</span></div>
    <div class="truth">${truth||`<span>${tr('emptyRobot')}</span>`}</div>
    <div class="go-row"><button class="go" data-a="newgame">${tr('newGame')}</button></div></div>`;
}
function screenBanned(){
  return host(tr('banSay'))+`<div class="body"><h2 class="ev-t">${tr('banT')}</h2><p class="ev-x">${tr('banX',G.probes+1,G.week+1)}</p>
    <div class="go-row"><button class="go" data-a="newgame">${tr('newGame')}</button></div></div>`;
}
function renderScreen(){
  const s=G.screen;
  $('#screen').innerHTML=s==='news'?screenNews():s==='event'?screenEvent():s==='work'?screenWork():s==='plan'?screenPlan():s==='final'?screenFinal():s==='over'?screenOver():screenBanned();
}
function arcArt(seed){let s=seed||1;const r=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296};const W_=24,H=8;const g=new Array(W_*H).fill(0);
  for(let k=0;k<5;k++){const c=1+Math.floor(r()*9),w=1+Math.floor(r()*6),h=1+Math.floor(r()*4),x=Math.floor(r()*(W_-w)),y=Math.floor(r()*(H-h));for(let i=x;i<x+w;i++)for(let j=y;j<y+h;j++)g[j*W_+i]=c}
  return g.map(c=>`<i style="background:${ARC[c]}"></i>`).join('')}
function paperHTML(){
  const P=G.papers;if(!P.length)return'';const i=clamp(G.ui.pi??P.length-1,0,P.length-1);const e=P[i];
  return`<div class="paper"><div class="p-top"><span>${tr('issue',e.n)}</span><span>${tr('pDate',fd(wkDays(e.w)[0]))}</span><span>${tr('weekly')}</span></div>
    <div class="p-mast">${tr('digest')}</div><div class="p-sub">${tr('pSub')}</div>
    <div class="p-cols"><article class="p-lead"><div class="p-ill" aria-hidden="true">${arcArt(e.art)}</div><div class="p-kicker">${esc(tx(e.lead.k))}</div><h3>${esc(tx(e.lead.h))}</h3><p>${esc(tx(e.lead.t))}</p></article>
    <aside><h4>${tr('hMain')}</h4><ul>${e.news.map(x=>`<li>${esc(tx(x))}</li>`).join('')}</ul><h4 style="margin-top:12px">${tr('hWire')}</h4><ul>${e.wire.map(x=>`<li>${esc(tx(x))}</li>`).join('')}</ul><h4 style="margin-top:12px">${tr('hForum')}</h4><ul>${e.forum.map(x=>`<li>${esc(tx(x))}</li>`).join('')}</ul></aside></div>
    <div class="p-foot">${tr('pFoot')}<a href="https://arc.markbarney.net/news" target="_blank" rel="noopener">arc.markbarney.net/news</a></div></div>
    <div class="p-nav"><button class="go soft" data-a="pprev" ${i<=0?'disabled':''}>${tr('pPrev')}</button><button class="go" data-a="closeModal">${tr('close')}</button><button class="go soft" data-a="pnext" ${i>=P.length-1?'disabled':''}>${tr('pNext')}</button></div>`;
}
function startHTML(){
  return`<div class="shead"><h2>${tr('sTitle')}</h2>${langBtn()}</div><p>${tr('sIntro')}</p>
   <label class="field" for="nick">${tr('nick')}<input id="nick" maxlength="24" placeholder="tile_rookie" autocomplete="off"></label>
   <div class="starts">${tr('starts').map(([k,t,d])=>`<button class="pl" data-a="start" data-x="${k}"><span><b>${t}</b><span>${d}</span></span></button>`).join('')}</div>`;
}
function helpHTML(){return`<h2>${tr('hTitle')}</h2><ol class="rules">
  ${tr('rules').map(r=>`<li>${r}</li>`).join('\n  ')}</ol>
  <div class="go-row"><button class="go" data-a="closeModal">${tr('gotIt')}</button></div>`}
function renderModal(){
  const el=$('#modal');const m=G.ui.modal;let h='',cls='card';
  if(m==='start')h=startHTML();else if(m==='help')h=helpHTML();else if(m==='paper'&&G.papers.length){h=paperHTML();cls='card paperc'}
  if(!h){el.hidden=true;el.innerHTML='';el.dataset.k='';return}
  const key=m+':'+LANG;
  if(m==='start'&&!el.hidden&&el.dataset.k===key)return;
  const nk=$('#nick'),nv=m==='start'&&nk?nk.value:null;
  el.dataset.k=key;el.hidden=false;el.innerHTML=`<div class="${cls}" role="dialog" aria-modal="true">${h}</div>`;
  if(nv!=null&&$('#nick'))$('#nick').value=nv;
}
function render(){renderTop();renderScreen();renderBezel();renderModal();drawFace()}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}

const ACT={
  start(x){const nm=($('#nick')||{}).value;newGame(x,nm);G.ui.modal=null},newgame(){G.ui.modal='start'},help(){G.ui.modal='help'},closeModal(){G.ui.modal=null},
  paper(){G.ui.modal='paper';G.ui.pi=G.papers.length-1;G.ui.seen=G.papers[G.papers.length-1].w},pprev(){G.ui.pi=Math.max(0,(G.ui.pi??0)-1)},pnext(){G.ui.pi=Math.min(G.papers.length-1,(G.ui.pi??0)+1)},
  next(){advance()},back(){if(G.screen==='plan')G.screen='work'},ev(x){evPick(+x)},opt(x){doOpt(+x)},
  slot(x){if(!slotCard(x)&&G.robot.length>=6)G.say=msg('slotFull')},unslot(x){unslotCard(x)},hint(){G.say=msg('hint')},
  plan(x){runWeek(+x)},pick(x){togglePick(x)},reveal(){finalReveal()},lang(){setLang(LANG==='en'?'ru':'en')}
};
function act(a,x){const f=ACT[a];if(!f||!G)return;try{f(x)}catch(err){console.error(err)}if(a!=='lang')save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.x)});
document.addEventListener('keydown',e=>{if(!G||e.target.tagName==='INPUT')return;
  if(!$('#modal').hidden){if(e.key==='Escape'&&G.ui.modal!=='start')act('closeModal');return}
  const k=e.key;if(/^[1-3]$/.test(k)){if(G.screen==='work'&&G.opts[+k-1]&&G.left>0)act('opt',String(+k-1));else if(G.screen==='plan'&&planOpts()[+k-1])act('plan',String(+k-1));else if(G.screen==='event'){const ev=EV[G.queue[0]];if(ev&&ev.c[+k-1])act('ev',String(+k-1))}}
  else if(k==='Enter'&&(G.screen==='news'||G.screen==='work'))act('next')});

function boot(){let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
  if(s&&s.v===5)G=s;else{newGame('copy');G.ui.modal='start'}applyLang();render()}
boot();
try{const hot=window.claude&&window.claude.hot;if(hot&&typeof hot.snapshot==='function')hot.snapshot(()=>({G}));if(hot&&typeof hot.ready==='function')hot.ready(d=>{if(d&&d.G&&d.G.v===5){G=d.G;render()}})}catch(e){}
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(!G)return;blink=true;drawFace();setTimeout(()=>{blink=false;drawFace()},140)},3800);
window.LB={get G(){return G},act,render};
})();
</script>
